
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMC Password Generator</title>
</head>
<body>
<h2>Dreamy Music Club</h2>
<h3>Admin Password Hash Generator</h3>

<input id="password" type="password"
placeholder="Enter your admin password">

<button onclick="generate()">Generate Hash</button>

<p id="status"></p>
<textarea id="result" rows="4"
style="width:100%" readonly></textarea>

<script>
async function generate() {
  const p = document.getElementById("password").value;
  const status = document.getElementById("status");

  if (!p) {
    status.textContent = "Password দিন।";
    return;
  }

  if (!crypto.subtle) {
    status.textContent = "Secure HTTPS connection প্রয়োজন।";
    return;
  }

  status.textContent = "Generating...";

  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));

  const key = await crypto.subtle.importKey(
    "raw", enc.encode(p), "PBKDF2", false, ["deriveBits"]
  );

  const bits = await crypto.subtle.deriveBits({
    name: "PBKDF2",
    salt: salt,
    iterations: 310000,
    hash: "SHA-256"
  }, key, 256);

  const hex = b => [...new Uint8Array(b)]
    .map(x => x.toString(16).padStart(2,"0")).join("");

  document.getElementById("result").value =
    hex(salt) + "." + hex(bits);

  document.getElementById("password").value = "";
  status.textContent = "Hash generated successfully!";
}
</script>
</body>
</html>
